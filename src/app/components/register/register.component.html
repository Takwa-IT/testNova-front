<!-- src/app/components/auth/register/register.component.html -->
<div class="register-container">
    <div class="register-card">
        <!-- Header -->
        <div class="register-header">
            <div class="register-logo">
                <i>🚀</i>
            </div>
            <h1 class="register-title">Créer un compte</h1>
            <p class="register-subtitle">Rejoignez TestNova en 30 secondes</p>
        </div>

        <!-- Form -->
        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-form">
            <!-- Nom et Prénom -->
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Nom</label>
                    <input type="text" formControlName="nom" class="form-input" placeholder="Votre nom">
                </div>
                <div class="form-group">
                    <label class="form-label">Prénom</label>
                    <input type="text" formControlName="prenom" class="form-input" placeholder="Votre prénom">
                </div>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" formControlName="email" class="form-input" placeholder="votre@email.com"
                    [class.error]="emailExists">
                <div class="email-status" *ngIf="emailChecking">
                    <span class="loading-small"></span>
                    <span class="email-checking">Vérification...</span>
                </div>
                <div class="email-status" *ngIf="!emailChecking && emailExists">
                    <span class="email-taken">❌ Email déjà utilisé</span>
                </div>
                <div class="email-status" *ngIf="!emailChecking && !emailExists && registerForm.get('email')?.valid">
                    <span class="email-available">✅ Email disponible</span>
                </div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label class="form-label">Mot de passe</label>
                <input type="password" formControlName="motDePasse" class="form-input"
                    placeholder="Minimum 6 caractères">
            </div>

            <!-- Role Selection -->
            <div class="role-selection">
                <label class="role-label">Je suis</label>
                <div class="role-options">
                    <label class="role-option" [class.selected]="registerForm.get('role')?.value === 'CANDIDAT'">
                        <input type="radio" formControlName="role" value="CANDIDAT" class="role-radio">
                        <div class="role-indicator"></div>
                        <div class="role-info">
                            <div class="role-name">Candidat</div>
                            <div class="role-description">Je cherche un emploi</div>
                        </div>
                    </label>
                    <label class="role-option" [class.selected]="registerForm.get('role')?.value === 'HR'">
                        <input type="radio" formControlName="role" value="HR" class="role-radio">
                        <div class="role-indicator"></div>
                        <div class="role-info">
                            <div class="role-name">Recruteur</div>
                            <div class="role-description">Je recrute des talents</div>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Messages -->
            <div *ngIf="errorMessage" class="message-container error-container">
                <p class="message-text error-text">{{ errorMessage }}</p>
            </div>

            <div *ngIf="successMessage" class="message-container success-container">
                <p class="message-text success-text">{{ successMessage }}</p>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="register-btn" [disabled]="!registerForm.valid || isLoading || emailExists"
                (click)="navigateToFeed() ">
                <span *ngIf=" isLoading" class="loading"></span>
                {{ isLoading ? 'Création...' : 'Créer mon compte' }}
            </button>
        </form>

        <!-- Login Link -->
        <div class="login-section">
            <p class="login-text">Déjà un compte ?</p>
            <button class="login-btn" (click)="navigateToLogin()">
                <span>Se connecter</span>
                <i>→</i>
            </button>
        </div>
    </div>
</div>
