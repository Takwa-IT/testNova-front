<div class="forgot-password-container">
  <div class="forgot-password-card">
    <!-- Header -->
    <div class="card-header">
      <div class="header-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h1>Mot de passe oublié ?</h1>
      <p>Entrez votre email pour recevoir un lien de réinitialisation</p>
    </div>

    <!-- Success State -->
    <div *ngIf="emailSent" class="success-state">
      <div class="success-icon">✉️</div>
      <h2>Email envoyé !</h2>
      <p>{{ successMessage }}</p>
      <p class="hint">Vérifiez également votre dossier spam.</p>
      <a routerLink="/login" class="btn btn-primary">Retour à la connexion</a>
    </div>

    <!-- Form -->
    <form *ngIf="!emailSent" [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
      <!-- Error Message -->
      <div *ngIf="errorMessage" class="alert alert-error">
        <span class="alert-icon">!</span>
        {{ errorMessage }}
      </div>

      <div class="form-group">
        <label for="email">Adresse email</label>
        <div class="input-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
          <input 
            type="email" 
            id="email" 
            formControlName="email" 
            placeholder="votre@email.com"
            [class.invalid]="forgotForm.get('email')?.touched && forgotForm.get('email')?.invalid">
        </div>
        <span class="error-text" *ngIf="forgotForm.get('email')?.touched && forgotForm.get('email')?.invalid">
          Veuillez entrer un email valide
        </span>
      </div>

      <button type="submit" class="btn btn-primary btn-full" [disabled]="loading || forgotForm.invalid">
        <span *ngIf="loading" class="spinner"></span>
        {{ loading ? 'Envoi en cours...' : 'Envoyer le lien' }}
      </button>

      <div class="form-footer">
        <a routerLink="/login" class="back-link">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Retour à la connexion
        </a>
      </div>
    </form>
  </div>
</div>
